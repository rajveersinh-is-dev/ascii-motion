[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-motion"
version = "0.1.0"
description = "A high-performance, cross-platform video-to-ASCII rendering engine with CLI and interactive local web application."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rajveersinh Pardeshi", email = "daveaddams91@gmail.com" }
]
keywords = ["ascii", "video", "terminal", "animation", "computer-vision", "rendering", "fastapi", "react"]
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "imageio-ffmpeg>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
ascii-motion = "ascii_motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
